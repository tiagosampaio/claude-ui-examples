<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1400" width="1080" height="1400">
  <title>Warm living room at golden hour</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4d2bb"/>
      <stop offset="0.55" stop-color="#cfb496"/>
      <stop offset="1" stop-color="#a98466"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0cf" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffcf8f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="artSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14304a"/>
      <stop offset="0.6" stop-color="#27506a"/>
      <stop offset="1" stop-color="#c2653a"/>
    </linearGradient>
    <radialGradient id="artSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.7" stop-color="#f4813a"/>
      <stop offset="1" stop-color="#d9531f"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdf9e" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffb763" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb763" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c0"/>
      <stop offset="1" stop-color="#ffc678"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a96a3c"/>
      <stop offset="1" stop-color="#6d3f22"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ab76"/>
      <stop offset="1" stop-color="#9d6e41"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d0704a"/>
      <stop offset="0.45" stop-color="#e4916a"/>
      <stop offset="1" stop-color="#8f4326"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8cdbd"/>
      <stop offset="0.4" stop-color="#f4ece0"/>
      <stop offset="1" stop-color="#a79a88"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f9a58"/>
      <stop offset="1" stop-color="#22512f"/>
    </linearGradient>
    <linearGradient id="niche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8a"/>
      <stop offset="0.25" stop-color="#6b4227"/>
      <stop offset="1" stop-color="#2e1c12"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="contactShadow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="10" dy="22" stdDeviation="20" flood-color="#2a160a" flood-opacity="0.45"/>
    </filter>

    <!-- Stretched noise reads as wood grain. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.22" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.08  0 0 0 0 0.03  0 0 0 1.5 -0.55"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>

    <!-- Fine noise gives the plaster wall some tooth. -->
    <filter id="plaster" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0 0.08  0 0 0 0.16 0"/>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>

    <path id="frond" d="M0 0C-34-40-46-96-8-150 30-100 28-44 0 0Z" fill="url(#leaf)"/>
  </defs>

  <!-- Wall -->
  <rect width="1080" height="1000" fill="url(#wall)" filter="url(#plaster)"/>
  <polygon points="-40,-40 520,-40 980,1000 300,1000" fill="url(#sunbeam)" filter="url(#soft)"/>

  <!-- Glowing wall niche, top right -->
  <g filter="url(#dropShadow)">
    <rect x="880" y="-10" width="210" height="460" fill="url(#niche)"/>
    <rect x="880" y="208" width="210" height="14" fill="#a4683b"/>
    <rect x="880" y="436" width="210" height="16" fill="#a4683b"/>
    <rect x="925" y="120" width="56" height="88" rx="10" fill="url(#clay)"/>
    <rect x="1000" y="150" width="60" height="58" rx="28" fill="url(#bone)"/>
    <g transform="translate(1000 340)">
      <rect width="80" height="14" y="82" fill="#3f5c6e"/>
      <rect width="72" height="14" y="68" x="5" fill="#c9a06c"/>
      <circle cx="40" cy="36" r="32" fill="url(#artSun)"/>
    </g>
  </g>

  <!-- Large framed artwork: a saturated block for the glass to blur -->
  <g filter="url(#dropShadow)">
    <rect x="96" y="96" width="750" height="620" fill="#2a1a10"/>
    <rect x="114" y="114" width="714" height="584" fill="url(#artSky)"/>
    <circle cx="470" cy="400" r="150" fill="url(#artSun)"/>
    <path d="M114 520C230 440 320 500 440 470 570 438 690 490 828 430V698H114Z" fill="#a3431f"/>
    <path d="M114 590C260 530 390 610 520 570 640 534 730 590 828 550V698H114Z" fill="#5d2a1a"/>
    <path d="M114 650C280 610 460 680 828 620V698H114Z" fill="#1e2d3a"/>
  </g>

  <!-- Floor lamp and its pool of light -->
  <circle cx="990" cy="650" r="300" fill="url(#lampGlow)"/>
  <rect x="984" y="660" width="8" height="330" fill="#2d2019"/>
  <path d="M920 700 952 560H1024L1056 700Z" fill="url(#shade)"/>

  <!-- Skirting and floor behind the furniture -->
  <rect y="985" width="1080" height="30" fill="#ece1d1"/>
  <rect y="1015" width="1080" height="400" fill="#6a4630"/>

  <!-- Credenza -->
  <ellipse cx="540" cy="1205" rx="480" ry="20" fill="#1c0e06" opacity="0.6" filter="url(#contactShadow)"/>
  <g>
    <rect x="130" y="1170" width="18" height="38" fill="#2d1a0e"/>
    <rect x="932" y="1170" width="18" height="38" fill="#2d1a0e"/>
    <rect x="70" y="850" width="940" height="325" fill="url(#walnut)" filter="url(#grain)"/>
    <rect x="70" y="850" width="940" height="10" fill="#d09a64"/>
    <g fill="none" stroke="#2d1a0e" stroke-opacity="0.75" stroke-width="3">
      <rect x="92" y="878" width="290" height="276" rx="3"/>
      <rect x="395" y="878" width="290" height="276" rx="3"/>
      <rect x="698" y="878" width="290" height="276" rx="3"/>
    </g>
    <g fill="#e6c48b">
      <rect x="360" y="980" width="7" height="72" rx="3"/>
      <rect x="664" y="980" width="7" height="72" rx="3"/>
      <rect x="714" y="980" width="7" height="72" rx="3"/>
    </g>
  </g>

  <!-- Objects on the credenza -->
  <rect x="150" y="826" width="170" height="24" fill="#31566a"/>
  <rect x="164" y="804" width="146" height="22" fill="#d7b98b"/>
  <path d="M770 850C740 780 742 710 780 680H850C888 710 890 780 860 850Z" fill="url(#clay)"/>
  <rect x="786" y="654" width="58" height="30" rx="6" fill="#a95730"/>

  <!-- Foreground table -->
  <rect y="1242" width="1080" height="170" fill="url(#oak)" filter="url(#grain)"/>
  <rect y="1236" width="1080" height="10" fill="#ecc698"/>

  <!-- Potted plant, left -->
  <ellipse cx="205" cy="1262" rx="120" ry="14" fill="#2a160a" opacity="0.55" filter="url(#contactShadow)"/>
  <g transform="translate(205 1120)">
    <use href="#frond" transform="rotate(-72) scale(1.25)"/>
    <use href="#frond" transform="rotate(68) scale(1.25)"/>
    <use href="#frond" transform="rotate(-48) scale(1.45)"/>
    <use href="#frond" transform="rotate(46) scale(1.45)"/>
    <use href="#frond" transform="rotate(-24) scale(1.6)"/>
    <use href="#frond" transform="rotate(24) scale(1.6)"/>
    <use href="#frond" transform="scale(1.75)"/>
  </g>
  <path d="M120 1112H290L268 1256H142Z" fill="url(#bone)"/>
  <rect x="112" y="1100" width="186" height="24" rx="6" fill="#efe6d8"/>

  <!-- Ceramics, right -->
  <ellipse cx="830" cy="1266" rx="150" ry="14" fill="#2a160a" opacity="0.55" filter="url(#contactShadow)"/>
  <rect x="740" y="1130" width="96" height="130" rx="12" fill="url(#bone)"/>
  <ellipse cx="788" cy="1130" rx="48" ry="9" fill="#8b7e6e"/>
  <rect x="854" y="1170" width="118" height="90" rx="16" fill="url(#clay)"/>
  <ellipse cx="913" cy="1170" rx="59" ry="9" fill="#6f3219"/>

  <!-- Bowl, center -->
  <ellipse cx="510" cy="1266" rx="130" ry="12" fill="#2a160a" opacity="0.5" filter="url(#contactShadow)"/>
  <path d="M400 1200H620C612 1246 568 1262 510 1262S408 1246 400 1200Z" fill="url(#clay)"/>
  <ellipse cx="510" cy="1200" rx="110" ry="11" fill="#7a3a1f"/>
</svg>
