<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080e"/>
      <stop offset="0.55" stop-color="#070d17"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="0.45" stop-color="#3a4250"/>
      <stop offset="0.6" stop-color="#8b95a5"/>
      <stop offset="0.72" stop-color="#2a313c"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#04121f"/>
      <stop offset="0.4" stop-color="#0d5f9e"/>
      <stop offset="0.62" stop-color="#3bb4ff"/>
      <stop offset="0.8" stop-color="#0c5288"/>
      <stop offset="1" stop-color="#03101c"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd4ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#e6f7ff"/>
      <stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="crisp" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1080" height="1400" fill="url(#base)"/>

  <!-- Deep glow behind everything. -->
  <path d="M-200 1020C180 780 470 620 1300 240" fill="none" stroke="#0f6cb0" stroke-width="330" opacity="0.5" filter="url(#softer)"/>

  <!-- Broad graphite ribbons. -->
  <path d="M-160 330C210 170 620 170 1260 -90" fill="none" stroke="url(#graphite)" stroke-width="150" filter="url(#soft)"/>
  <path d="M-180 1490C160 1250 500 1180 1270 1320" fill="none" stroke="url(#graphite)" stroke-width="210" filter="url(#soft)"/>
  <path d="M-200 1180C120 1060 300 1250 640 1560" fill="none" stroke="url(#graphite)" stroke-width="120" opacity="0.75" filter="url(#soft)"/>

  <!-- Electric blue ribbons. -->
  <path d="M-180 560C230 330 620 300 1260 40" fill="none" stroke="url(#electric)" stroke-width="86" filter="url(#crisp)"/>
  <path d="M-160 1170C260 1010 640 830 1270 650" fill="none" stroke="url(#electric)" stroke-width="128" filter="url(#crisp)"/>
  <path d="M340 1500C560 1270 830 1120 1270 1040" fill="none" stroke="url(#electric)" stroke-width="58" filter="url(#crisp)"/>

  <!-- Thin highlights that ride along the ribbons. -->
  <path d="M-180 530C230 300 620 270 1260 12" fill="none" stroke="url(#glint)" stroke-width="7"/>
  <path d="M-160 1124C260 964 640 784 1270 604" fill="none" stroke="url(#glint)" stroke-width="10"/>
  <path d="M-200 1310C160 1090 500 1020 1270 1170" fill="none" stroke="url(#glint)" stroke-width="4" opacity="0.7"/>
  <path d="M-160 200C210 40 620 40 1260 -220" fill="none" stroke="url(#glint)" stroke-width="5" opacity="0.8"/>
</svg>
