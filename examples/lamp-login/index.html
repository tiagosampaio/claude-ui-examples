<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lamp Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="stage" id="stage">
      <h1 class="stage__title stage__title--stacked">Lamp Login<span class="stage__accent">Pull the cord</span></h1>

      <section class="scene" id="scene">
        <div class="room room--lit"></div>
        <div class="beam"></div>
        <canvas class="dust" id="dust" width="1080" height="1400"></canvas>

        <svg class="lamp" viewBox="0 0 1080 1400" aria-hidden="true">
          <defs>
            <linearGradient id="poleMetal" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#17161c"/>
              <stop offset="0.45" stop-color="#4d4a55"/>
              <stop offset="1" stop-color="#121116"/>
            </linearGradient>
            <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#6d4c20"/>
              <stop offset="0.45" stop-color="#d9ad62"/>
              <stop offset="1" stop-color="#5a3d18"/>
            </linearGradient>
            <linearGradient id="shadeOff" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#16151c"/>
              <stop offset="0.45" stop-color="#34323e"/>
              <stop offset="1" stop-color="#121117"/>
            </linearGradient>
            <linearGradient id="shadeOn" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e8b878"/>
              <stop offset="0.65" stop-color="#ffdca0"/>
              <stop offset="1" stop-color="#fff0cc"/>
            </linearGradient>
            <radialGradient id="baseMetal" cx="0.5" cy="0.3" r="0.7">
              <stop offset="0" stop-color="#57535f"/>
              <stop offset="1" stop-color="#121116"/>
            </radialGradient>
            <filter id="bulbGlow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="20"/>
            </filter>
          </defs>

          <!-- Base and pole -->
          <ellipse cx="215" cy="1214" rx="125" ry="24" fill="url(#baseMetal)"/>
          <ellipse cx="215" cy="1204" rx="96" ry="16" fill="#2a2831"/>
          <rect x="195" y="1178" width="40" height="26" rx="5" fill="url(#brass)"/>
          <rect x="207" y="430" width="16" height="755" fill="url(#poleMetal)"/>
          <rect x="201" y="800" width="28" height="30" rx="4" fill="url(#brass)"/>

          <!-- Bulb -->
          <circle cx="215" cy="432" r="30" fill="#3a3842"/>
          <circle class="lamp__on" cx="215" cy="432" r="30" fill="#fff4d6"/>
          <circle class="lamp__on" cx="215" cy="432" r="46" fill="#ffd98f" filter="url(#bulbGlow)"/>

          <!-- Shade -->
          <path d="M120 190 65 400A150 26 0 0 0 365 400L310 190A95 16 0 0 0 120 190Z" fill="url(#shadeOff)"/>
          <path class="lamp__on" d="M120 190 65 400A150 26 0 0 0 365 400L310 190A95 16 0 0 0 120 190Z" fill="url(#shadeOn)"/>
          <ellipse cx="215" cy="190" rx="95" ry="16" fill="#26242d"/>
          <ellipse class="lamp__on" cx="215" cy="190" rx="95" ry="16" fill="#c98f52"/>
          <path d="M65 400A150 26 0 0 0 365 400" fill="none" stroke="#5a5560" stroke-width="3"/>
          <path class="lamp__on" d="M65 400A150 26 0 0 0 365 400" fill="none" stroke="#fff6df" stroke-width="5"/>
        </svg>

        <svg class="cord" viewBox="0 0 1080 1400" aria-hidden="true">
          <path class="cord__line" id="cordLine"/>
        </svg>

        <button class="cord-handle" id="cordHandle" type="button" data-item="cord" aria-label="Pull the lamp cord">
          <span class="cord-handle__knob"></span>
        </button>

        <p class="hint">
          <span class="hint__text hint__text--off">Pull for light</span>
          <span class="hint__text hint__text--on">Pull for dark</span>
        </p>

        <p class="brand">Lantern</p>

        <form class="card" id="card" autocomplete="off" novalidate></form>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
