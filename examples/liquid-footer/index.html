<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liquid Footer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500&family=Inter:wght@400;500;600;700;900&display=swap">
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="stage" id="stage">
      <h1 class="stage__title stage__title--stacked">Liquid Glass<span class="stage__accent">Footer</span></h1>

      <section class="scene" id="scene">
        <div class="room">
          <div class="room__layer room__layer--day"></div>
          <div class="room__layer room__layer--night"></div>
        </div>

        <div class="glass" id="glass">
          <div class="footer" id="footer"></div>
        </div>
        <svg class="edge" viewBox="0 0 1000 980" aria-hidden="true">
          <path id="edge" class="edge__line"/>
        </svg>

        <div class="drop" id="drop"></div>
      </section>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
